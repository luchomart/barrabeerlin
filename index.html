<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stock Barra</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1 id="titulo-app">&#x1F37A; Stock Barra</h1>
        <p>Selecciona el sector y carga las unidades</p>
      </header>

      <section class="config">
        <label for="select-empleado">Empleado:</label>
        <select id="select-empleado"></select>

        <label for="select-sector">Sector:</label>
        <select id="select-sector"></select>
      </section>

      <section class="busqueda">
        <div class="buscador-wrapper">
          <span class="buscador-icon">&#x1F50E;</span>
          <input
            type="text"
            id="buscar-producto"
            placeholder="Buscar producto..."
            autocomplete="off"
          />
        </div>
      </section>

      <main id="lista-productos">
        <div class="loader">Cargando productos...</div>
      </main>

      <footer>
        <button id="btn-guardar">&#x1F4BE; Guardar conteo</button>

        <div class="acciones-stock">
          <p class="acciones-titulo">&#x1F4E6; Compartir stock</p>

          <div class="acciones-botones">
            <button id="btn-copiar-stock">&#x1F4CB; Copiar</button>
            <button id="btn-wpp-stock">&#x1F4F1; WhatsApp</button>
          </div>
        </div>
      </footer>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
