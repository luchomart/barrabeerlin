<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stock Barra</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <h1 id="titulo-app">🍺 Stock Barra</h1>
        <p>Seleccioná el sector y cargá las unidades</p>
      </header>

      <!-- =============================
     CONFIGURACIÓN
============================= -->

      <section class="config">
        <label for="select-empleado">Empleado:</label>
        <select id="select-empleado"></select>

        <label for="select-sector">Sector:</label>
        <select id="select-sector"></select>
      </section>

      <section class="busqueda">
        <div class="buscador-wrapper">
          <span class="buscador-icon">🔎</span>
          <input
            type="text"
            id="buscar-producto"
            placeholder="Buscar producto..."
            autocomplete="off"
          />
        </div>
      </section>

      <main id="lista-productos">
        <div class="loader">Cargando productos...</div>
      </main>

      <footer>
        <button id="btn-guardar">💾 Guardar conteo</button>

        <div class="acciones-stock">
          <p class="acciones-titulo">📦 Compartir stock</p>

          <div class="acciones-botones">
            <button id="btn-copiar-stock">📋 Copiar</button>

            <button id="btn-wpp-stock">📱 WhatsApp</button>
          </div>
        </div>
      </footer>
    </div>

    <!-- APP -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
