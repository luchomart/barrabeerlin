<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Supervisor Stock</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0d0f12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <div class="header-fila">
          <h1>Supervisor</h1>
          <button id="btn-volver" type="button" class="btn-texto">Volver al conteo</button>
        </div>
        <p>Estado del inventario</p>
      </header>

      <section id="supervisor-auth-shell" class="supervisor-auth-shell">
        <div class="supervisor-loader">
          <span class="supervisor-loader-spinner"></span>
          <span>Verificando acceso de supervisor…</span>
        </div>
      </section>

      <section class="acciones-supervisor">
        <button id="btn-recargar" type="button" hidden>Actualizar</button>
        <button id="btn-whatsapp" type="button" hidden>Enviar stock</button>
        <button id="btn-admin" type="button" hidden>Administrar</button>
      </section>

      <section id="seccion-admin" class="supervisor-section admin-section" hidden>
        <h2>Administración</h2>

        <div id="admin-contenido"></div>
      </section>

      <section class="supervisor-section" hidden>
        <h2>Estado de sectores</h2>

        <div id="estado-sectores">
          <div class="loader">Cargando estado…</div>
        </div>
      </section>

      <section class="supervisor-section" hidden>
        <h2>Últimos conteos</h2>

        <main id="lista-conteos">
          <div class="loader">Cargando conteos…</div>
        </main>
      </section>

      <section class="supervisor-section" hidden>
        <h2>Cambios de stock</h2>

        <div id="lista-cambios-stock">
          <div class="loader">Cargando cambios…</div>
        </div>
      </section>
    </div>

    <script type="module" src="js/supervisor.js"></script>
  </body>
</html>
